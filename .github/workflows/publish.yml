name: Publish to NPM and MCP Registry

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # OIDC for npm trusted publishing + MCP registry login

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency (package.json / manifest.json / server.json)
        run: pnpm check:versions

      - name: Validate
        run: pnpm validate

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Build Claude Desktop Extension (.mcpb)
        run: |
          chmod +x ./scripts/build-mcpb.sh
          ./scripts/build-mcpb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            power-automate-mcp-server.mcpb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MCP Publisher
        # v1.7.6+ required: registry binds the GitHub OIDC token exchange to a
        # per-deployment audience (https://registry.modelcontextprotocol.io)
        # rather than the legacy "mcp-registry" string. Older publisher
        # versions request the legacy audience and the server rejects them
        # with HTTP 401 ("invalid audience").
        # Release: https://github.com/modelcontextprotocol/registry/releases/tag/v1.7.6
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
